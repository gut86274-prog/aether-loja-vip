<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gestão de Cash</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <h1 class="text-3xl font-bold mb-6">📦 Vendas Pendentes</h1>
    <table class="w-full text-left glass rounded-lg overflow-hidden">
        <thead class="bg-slate-800">
            <tr>
                <th class="p-4">Nick</th>
                <th class="p-4">Valor</th>
                <th class="p-4">Status</th>
                <th class="p-4">Ação</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        async function loadVendas() {
            const res = await fetch('/admin/vendas');
            const vendas = await res.json();
            const body = document.getElementById('table-body');
            body.innerHTML = '';

            vendas.forEach(v => {
                body.innerHTML += `
                    <tr class="border-b border-slate-800">
                        <td class="p-4">${v.nick}</td>
                        <td class="p-4">R$ ${v.amount}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded text-xs ${v.status === 'pago' ? 'bg-green-600' : 'bg-yellow-600'}">
                                ${v.status.toUpperCase()}
                            </span>
                        </td>
                        <td class="p-4">
                            ${v.status === 'pago' ? `<button onclick="entregar('${v.id}')" class="bg-blue-600 px-3 py-1 rounded text-xs">Marcar Entregue</button>` : 'Aguardando'}
                        </td>
                    </tr>
                `;
            });
        }

        async function entregar(id) {
            await fetch('/admin/entregar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });
            loadVendas();
        }

        setInterval(loadVendas, 5000); // Atualiza a cada 5 segundos
        loadVendas();
    </script>
</body>
</html>
