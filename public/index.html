<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Games - Loja VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #1e1b4b, #0f172a); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-border { border: 2px solid #8b5cf6; box-shadow: 0 0 15px #8b5cf6; }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <div class="glass p-8 rounded-3xl w-full max-w-md neon-border text-center">
        <h1 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">
            AETHER STORE
        </h1>
        <p class="text-gray-400 mb-6">Adquira Moedas VIP instantaneamente</p>

        <div class="space-y-4">
            <input id="nick" type="text" placeholder="Seu Nick no Jogo" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-purple-500 transition">
            <input id="amount" type="number" placeholder="Valor em R$ (Ex: 5.00)" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-purple-500 transition">
            
            <button onclick="pagar()" id="btn-pagar" class="w-full bg-purple-600 hover:bg-purple-500 p-3 rounded-lg font-bold text-lg transition transform active:scale-95">
                GERAR PIX AGORA
            </button>
        </div>

        <div id="payment-area" class="hidden mt-6 p-4 bg-white rounded-xl text-black">
            <p class="font-bold mb-2">Escaneie o QR Code:</p>
            <img id="qr-img" src="" class="mx-auto w-48 h-48 mb-4">
            <textarea id="pix-copy" readonly class="w-full p-2 text-xs border rounded bg-gray-100 mb-2"></textarea>
            <p class="text-xs text-gray-500">O sistema avisará o Admin assim que o pagamento for aprovado.</p>
        </div>
    </div>

    <script>
        async function pagar() {
            const nick = document.getElementById('nick').value;
            const amount = document.getElementById('amount').value;
            if(!nick || !amount) return alert("Preencha tudo!");

            document.getElementById('btn-pagar').innerText = "Processando...";
            
            const res = await fetch('/create-payment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nick, amount })
            });
            const data = await res.json();

            document.getElementById('payment-area').classList.remove('hidden');
            document.getElementById('qr-img').src = `data:image/jpeg;base64,${data.qr_code_base64}`;
            document.getElementById('pix-copy').value = data.qr_code;
            document.getElementById('btn-pagar').innerText = "PIX GERADO!";
        }
    </script>
</body>
</html>
